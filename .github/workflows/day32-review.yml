# Read-only review on a trusted self-hosted runner that already has Ollama
# on 127.0.0.1:11434. This file has not been executed on GitHub.
# Fork PRs are skipped. The job checks out the PR head and runs this
# repository's reviewer, so do not enable it for untrusted contributors
# and do not add secrets.

name: Day 32 code review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: write

concurrency:
  group: day32-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, ollama]
    timeout-minutes: 20
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build indexes from the PR head
        run: python -m day32.index_code

      - name: Review base against head
        env:
          DAY32_BASE: ${{ github.event.pull_request.base.sha }}
          DAY32_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python -m day32 --base "$DAY32_BASE" --head "$DAY32_HEAD" --output day32/reports

      - name: Write step summary
        if: always()
        run: |
          report="$(find day32/reports -name review.md | head -n 1)"
          if [ -n "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Отчёт ревью не создан." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: day32-review
          path: day32/reports/
          if-no-files-found: warn
